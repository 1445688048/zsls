version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: palm-lawyer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: palm_lawyer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须通过环境变量显式提供}
      POSTGRES_DB: palm_lawyer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palm_lawyer -d palm_lawyer"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
