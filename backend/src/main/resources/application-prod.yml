# ===== 掌上律师 MVP - 生产环境配置（启动时加 --spring.profiles.active=prod） =====

spring:
  datasource:
    # stringtype=unspecified：实体经 JacksonTypeHandler 写 JSONB 列时按 varchar 绑定，
    # 缺该参数 PG 会报 "column ... is of type jsonb but expression is of type character varying"
    url: jdbc:postgresql://localhost:5432/palm_lawyer?stringtype=unspecified
    username: ${POSTGRES_USER:palm_lawyer}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  # 生产禁用 SQL 脚本初始化，建表请用 Flyway（V1 采用 backend/db/init.sql）或手动执行
  sql:
    init:
      mode: never

palmlawyer:
  cors:
    allowed-origins: ${PALMLAWYER_CORS_ALLOWED_ORIGINS:https://your-domain.example}
  auth:
    # 生产必须真实走微信登录，禁用 dev_openid 兜底
    dev-mode: false
