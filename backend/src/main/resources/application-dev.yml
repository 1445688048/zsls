# ===== 掌上律师 MVP - 开发环境配置（启动时加 --spring.profiles.active=dev） =====

# H2 控制台仅开发环境开放（本机访问）
spring:
  h2:
    console:
      enabled: true
      path: /h2-console

palmlawyer:
  # 业务层 H2 控制台开关（H2ConsoleConfig 条件装配）
  h2-console:
    enabled: true
  # 开发环境 CORS 放行任意来源（小程序开发者工具调试）
  cors:
    allowed-origins: "*"
