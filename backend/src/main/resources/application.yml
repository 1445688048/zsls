# 掌上律师 MVP 后端服务配置
# 开发阶段使用 H2 内存数据库，生产环境切换到 PostgreSQL

spring:
  application:
    name: palm-lawyer-backend
  
  # ========== 数据源配置 ==========
  # 开发环境：H2 内存数据库
  datasource:
    url: jdbc:h2:mem:palm_lawyer;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  # H2 控制台（默认关闭；开发环境由 application-dev.yml 开启）
  h2:
    console:
      enabled: false
      path: /h2-console
  
  # 数据库初始化
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  
  # 生产环境：PostgreSQL（取消注释启用）
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/palm_lawyer
  #   username: postgres
  #   password: postgres
  #   driver-class-name: org.postgresql.Driver
  #   hikari:
  #     maximum-pool-size: 20
  #     minimum-idle: 10
  
  # ========== 文件上传配置 ==========
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
  
  # ========== Jackson 配置（Spring Boot 4 使用 Jackson 3） ==========
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      FAIL_ON_EMPTY_BEANS: false
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false

# ========== MyBatis-Plus 配置 ==========
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
    banner: false

# ========== 服务器配置 ==========
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  tomcat:
    max-threads: 200
    accept-count: 100

# ========== 缓存配置 ==========
cache:
  type: caffeine
  caffeine:
    spec: maximumSize=1000,expireAfterWrite=24h

# ========== 日志配置 ==========
logging:
  level:
    root: INFO
    com.palmlawyer: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web: INFO
    com.baomidou.mybatisplus: DEBUG
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/palm-lawyer.log
    max-size: 10MB
    max-history: 30

# ========== 掌上律师业务配置 ==========
palmlawyer:
  # LLM 配置（OpenAI 兼容供应商）
  llm:
    api-key: ${LLM_API_KEY:REDACTED}
    base-url: '${LLM_BASE_URL:https://apihub.agnes-ai.com/v1}'
    model: ${LLM_MODEL:agnes-2.0-flash}
    temperature: ${LLM_TEMPERATURE:0.3}
    max-tokens: ${LLM_MAX_TOKENS:4096}
  
  # 微信小程序配置
  wechat:
    app-id: ${WECHAT_APP_ID:wx9a9175ad09b78bdf}
    app-secret: ${WECHAT_APP_SECRET:REDACTED}

  # 认证配置
  auth:
    # 开发模式：微信登录失败时用 code 派生 openid 兜底，方便本地调试（生产环境必须设为 false）
    dev-mode: ${PALMLAWYER_DEV_MODE:true}
  
  # 法律之星 API
  law-star:
    api-key: ${LAW_STAR_API_KEY:REDACTED}
    base-url: 'https://api.lawstar.com'
    cache-ttl: 24h
  
  # CORS 配置
  cors:
    allowed-origins: ${PALMLAWYER_CORS_ALLOWED_ORIGINS:*}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  
  # 文件存储配置
  storage:
    local-path: ${PALMLAWYER_STORAGE_PATH:./uploads}
    url-prefix: ${PALMLAWYER_STORAGE_URL_PREFIX:http://localhost:8080/api/v1/files}
  
  # 安全配置
  security:
    aes-secret-key: ${PALMLAWYER_AES_KEY:PalmLawyer2024SecretKeyForAES256Encryption!}
    jwt:
      # HS256 要求密钥至少 32 字节；此默认值仅用于本地开发，生产必须用环境变量覆盖
      secret: ${PALMLAWYER_JWT_SECRET:PalmLawyer2024-JWT-HS256-SecretKey-MustBe-AtLeast-32Bytes}
      expiration: 7d

# ========== Spring Boot Actuator（可选） ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized