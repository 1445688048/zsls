# 掌上律师 MVP 后端服务配置
# 开发阶段使用 H2 内存数据库，生产环境切换到 PostgreSQL（启用 prod profile）

spring:
  application:
    name: palm-lawyer-backend

  # ========== 数据源配置 ==========
  # 开发环境：H2 内存数据库
  datasource:
    url: jdbc:h2:mem:palm_lawyer;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # 数据库初始化（schema.sql/data.sql 为 H2 方言，仅默认 profile 使用；prod profile 已关闭）
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  # ========== 文件上传配置 ==========
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

  # ========== Jackson 配置 ==========
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      FAIL_ON_EMPTY_BEANS: false
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false

# ========== MyBatis-Plus 配置 ==========
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
    banner: false

# ========== 服务器配置 ==========
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  tomcat:
    threads:
      max: 200
    accept-count: 100

# ========== 日志配置 ==========
logging:
  level:
    root: INFO
    com.palmlawyer: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web: INFO
    com.baomidou.mybatisplus: DEBUG
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/palm-lawyer.log
    max-size: 10MB

# ========== 掌上律师业务配置 ==========
# 注意：所有密钥一律通过环境变量注入，配置文件中不再保存任何真实密钥。
palmlawyer:
  # LLM 配置（OpenAI 兼容供应商）
  llm:
    api-key: ${LLM_API_KEY:}
    base-url: '${LLM_BASE_URL:https://apihub.agnes-ai.com/v1}'
    model: ${LLM_MODEL:agnes-2.0-flash}
    temperature: ${LLM_TEMPERATURE:0.3}
    max-tokens: ${LLM_MAX_TOKENS:4096}

  # 微信小程序配置
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}

  # 认证配置
  auth:
    # 开发模式：微信登录失败时用 code 派生 openid 兜底。
    # 默认关闭（否则任意 code 都能换取合法 token，构成认证绕过）；
    # 本地调试请在 dev profile 或环境变量中显式开启。
    dev-mode: ${PALMLAWYER_DEV_MODE:false}

  # 法律之星 API
  law-star:
    api-key: ${LAW_STAR_API_KEY:}
    base-url: 'https://api.lawstar.com'
    cache-ttl: 24h

  # CORS 配置
  cors:
    allowed-origins: ${PALMLAWYER_CORS_ALLOWED_ORIGINS:*}
    allowed-methods: ${PALMLAWYER_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${PALMLAWYER_CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${PALMLAWYER_CORS_ALLOW_CREDENTIALS:true}
    max-age: ${PALMLAWYER_CORS_MAX_AGE:3600}

  # 文件存储配置
  storage:
    local-path: ${PALMLAWYER_STORAGE_PATH:./uploads}
    url-prefix: ${PALMLAWYER_STORAGE_URL_PREFIX:http://localhost:8080/api/v1/files}

  # 安全配置
  security:
    jwt:
      # HS256 要求密钥至少 32 字节。生产必须通过环境变量注入；
      # 未配置时应用会生成随进程的随机密钥（重启后旧 token 全部失效）并打印告警。
      secret: ${PALMLAWYER_JWT_SECRET:}
      expiration: 7d

  # 插件管理：配置 admin-token 后才允许调用 POST /plugins/reload（为空则接口拒绝）
  plugin:
    admin-token: ${PALMLAWYER_PLUGIN_ADMIN_TOKEN:}

# ========== Spring Boot Actuator ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
